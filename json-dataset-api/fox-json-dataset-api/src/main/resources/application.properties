
spring.application.name=json-dataset-api

# Server Configuration
server.port=${PORT:8082}

# MySQL Database Configuration - Aiven Cloud
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-2e3c6b29-adityavk099-359e.e.aivencloud.com:14483/freightfox_db?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
